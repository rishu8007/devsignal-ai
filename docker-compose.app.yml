services:
  ai:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required for the AI service}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-devsignal_knowledge_chunks}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-10}
      INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?AI_INTERNAL_API_KEY is required}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-45}
      WORKFLOW_CHECKPOINT_URI: ${WORKFLOW_CHECKPOINT_URI:-}
      WORKFLOW_CHECKPOINT_DATABASE: ${WORKFLOW_CHECKPOINT_DATABASE:-devsignal_workflow_checkpoints}
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_started
      mongo:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/devsignal?authSource=admin"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-3600}
      JWT_ISSUER: ${JWT_ISSUER:-devsignal-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-devsignal-web}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-devsignal_access_token}
      AI_SERVICE_URL: http://ai:8000
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?AI_INTERNAL_API_KEY is required}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-150000}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      mongo:
        condition: service_healthy
      ai:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
