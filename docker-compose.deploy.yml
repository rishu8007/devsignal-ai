name: devsignal-https

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - devsignal_deploy_caddy_data:/data
      - devsignal_deploy_caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/devsignal?authSource=admin"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-3600}
      JWT_ISSUER: ${JWT_ISSUER:-devsignal-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-devsignal-web}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-devsignal_access_token}
      AI_SERVICE_URL: http://ai:8000
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?AI_INTERNAL_API_KEY is required}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-150000}
      LINKEDIN_ENABLED: ${LINKEDIN_ENABLED:-false}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-}
      LINKEDIN_TOKEN_ENCRYPTION_KEY: ${LINKEDIN_TOKEN_ENCRYPTION_KEY:-}
      LINKEDIN_SCOPES: ${LINKEDIN_SCOPES:-openid profile email}
      LINKEDIN_POSTING_SCOPES: ${LINKEDIN_POSTING_SCOPES:-openid profile email w_member_social}
      LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-202601}
      LINKEDIN_PUBLISHING_ENABLED: ${LINKEDIN_PUBLISHING_ENABLED:-false}
      LINKEDIN_SCHEDULER_ENABLED: "false"
      LINKEDIN_SCHEDULE_HORIZON_DAYS: ${LINKEDIN_SCHEDULE_HORIZON_DAYS:-90}
      LINKEDIN_SCHEDULE_LATE_WINDOW_MINUTES: ${LINKEDIN_SCHEDULE_LATE_WINDOW_MINUTES:-60}
      GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
      GITHUB_SYNC_ENABLED: "false"
      GITHUB_SYNC_INTERVAL_MINUTES: ${GITHUB_SYNC_INTERVAL_MINUTES:-15}
      GITHUB_SYNC_MAX_PAGES_PER_PASS: ${GITHUB_SYNC_MAX_PAGES_PER_PASS:-3}
      GITHUB_INITIAL_HISTORY_DAYS: ${GITHUB_INITIAL_HISTORY_DAYS:-90}
    expose:
      - "4000"
    depends_on:
      mongo:
        condition: service_healthy
      ai:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-devsignal_knowledge_chunks}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-10}
      INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?AI_INTERNAL_API_KEY is required}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-45}
      WORKFLOW_CHECKPOINT_URI: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/devsignal_workflows?authSource=admin"
      WORKFLOW_CHECKPOINT_DATABASE: ${WORKFLOW_CHECKPOINT_DATABASE:-devsignal_workflows}
    expose:
      - "8000"
    depends_on:
      qdrant:
        condition: service_started
      mongo:
        condition: service_healthy

  github-sync:
    profiles: ["github-sync"]
    extends:
      service: api
    command: ["node", "services/api/dist/github-sync-worker.js"]
    environment:
      GITHUB_SYNC_ENABLED: ${GITHUB_SYNC_ENABLED:-false}
    healthcheck:
      disable: true
    restart: unless-stopped

  linkedin-scheduler:
    profiles: ["linkedin-scheduler"]
    extends:
      service: api
    command: ["node", "services/api/dist/linkedin-scheduler-worker.js"]
    environment:
      LINKEDIN_SCHEDULER_ENABLED: ${LINKEDIN_SCHEDULER_ENABLED:-false}
    healthcheck:
      disable: true
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: devsignal
    volumes:
      - devsignal_deploy_mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1",
        ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - devsignal_deploy_qdrant_data:/qdrant/storage

volumes:
  devsignal_deploy_caddy_data:
  devsignal_deploy_caddy_config:
  devsignal_deploy_mongo_data:
  devsignal_deploy_qdrant_data:
