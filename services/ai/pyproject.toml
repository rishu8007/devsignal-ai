[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsignal-ai-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "openai",
  "qdrant-client==1.19.0",
  "uvicorn[standard]",
  "pydantic-settings",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
  "ruff",
  "mypy",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
